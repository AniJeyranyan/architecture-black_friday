name: mongo-sharding-repl

# Variant 2: MongoDB sharding (2 shards) + replication (3 replicas per replica set)
#   pymongo_api -> mongos_router -> config_server replica set (configSrv-1..3, cluster metadata)
#                                -> shard1 replica set (shard1-1..3, data)
#                                -> shard2 replica set (shard2-1..3, data)
# Default MongoDB ports: mongos 27017, shard server 27018, config server 27019

x-mongo-healthcheck: &mongo-healthcheck
  interval: 5s
  timeout: 5s
  retries: 10
  start_period: 10s

x-config-server: &config-server
  image: dh-mirror.gitverse.ru/mongo:9.0.4
  restart: always
  command: ["mongod", "--configsvr", "--replSet", "config_server", "--bind_ip_all", "--port", "27019"]
  healthcheck:
    test: ["CMD", "mongosh", "--port", "27019", "--quiet", "--eval", "db.adminCommand('ping')"]
    <<: *mongo-healthcheck

x-shard-server: &shard-server
  image: dh-mirror.gitverse.ru/mongo:9.0.4
  restart: always
  healthcheck:
    test: ["CMD", "mongosh", "--port", "27018", "--quiet", "--eval", "db.adminCommand('ping')"]
    <<: *mongo-healthcheck

services:
  # Config server replica set "config_server" (3 members)
  configSrv-1:
    <<: *config-server
    container_name: configSrv-1
    volumes:
      - config1-data:/data/db

  configSrv-2:
    <<: *config-server
    container_name: configSrv-2
    volumes:
      - config2-data:/data/db

  configSrv-3:
    <<: *config-server
    container_name: configSrv-3
    volumes:
      - config3-data:/data/db

  # Shard 1: replica set "shard1" (3 members)
  shard1-1:
    <<: *shard-server
    container_name: shard1-1
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard1-1-data:/data/db

  shard1-2:
    <<: *shard-server
    container_name: shard1-2
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard1-2-data:/data/db

  shard1-3:
    <<: *shard-server
    container_name: shard1-3
    command: ["mongod", "--shardsvr", "--replSet", "shard1", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard1-3-data:/data/db

  # Shard 2: replica set "shard2" (3 members)
  shard2-1:
    <<: *shard-server
    container_name: shard2-1
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard2-1-data:/data/db

  shard2-2:
    <<: *shard-server
    container_name: shard2-2
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard2-2-data:/data/db

  shard2-3:
    <<: *shard-server
    container_name: shard2-3
    command: ["mongod", "--shardsvr", "--replSet", "shard2", "--bind_ip_all", "--port", "27018"]
    volumes:
      - shard2-3-data:/data/db

  # Query router: the only MongoDB entry point for the application
  mongos_router:
    image: dh-mirror.gitverse.ru/mongo:9.0.4
    container_name: mongos_router
    restart: always
    command: ["mongos", "--configdb", "config_server/configSrv-1:27019,configSrv-2:27019,configSrv-3:27019", "--bind_ip_all", "--port", "27017"]
    depends_on:
      configSrv-1: { condition: service_healthy }
      configSrv-2: { condition: service_healthy }
      configSrv-3: { condition: service_healthy }
      shard1-1: { condition: service_healthy }
      shard1-2: { condition: service_healthy }
      shard1-3: { condition: service_healthy }
      shard2-1: { condition: service_healthy }
      shard2-2: { condition: service_healthy }
      shard2-3: { condition: service_healthy }
    ports:
      - 27017:27017

  pymongo_api:
    container_name: pymongo_api
    build:
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongos_router
    ports:
      - 8080:8080
    environment:
      MONGODB_URL: "mongodb://mongos_router:27017"
      MONGODB_DATABASE_NAME: "somedb"

volumes:
  config1-data:
  config2-data:
  config3-data:
  shard1-1-data:
  shard1-2-data:
  shard1-3-data:
  shard2-1-data:
  shard2-2-data:
  shard2-3-data:
